<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>藏書閣 · 私人收藏</title>
<meta name="theme-color" content="#F1EADC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EADC;
    --bg-deep:#E4D6BC;
    --card:#FBF7ED;
    --ink:#241A10;
    --ink-soft:#6B5D46;
    --ink-faint:#A0937A;
    --line:#E1D3B4;
    --accent:#7A3244;
    --accent-soft:#F1E1DC;
    --moss:#4C5A40;
    --moss-soft:#E4E9D6;
    --gold:#8C6A1E;
    --gold-soft:#F5E7BE;
    --danger:#9B4237;
    --radius-xs:10px;
    --radius-sm:14px;
    --radius-card:18px;
    --radius-lg:24px;
    --radius-pill:999px;
    --shadow:0 1px 2px rgba(36,26,16,.06), 0 8px 22px -9px rgba(36,26,16,.28);
    --shadow-lg:0 20px 44px -16px rgba(36,26,16,.4), 0 4px 12px rgba(36,26,16,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:
      radial-gradient(ellipse 700px 380px at 10% -6%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(ellipse 700px 420px at 100% 0%, rgba(0,0,0,.03), transparent 55%),
      var(--bg-deep);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    transition:background-color .2s ease;
  }
  body.modal-open{overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--accent-soft);color:var(--accent);}

  /* Shared tactile interaction: gentle press feedback everywhere */
  .book-card,.img-card,.article-card,.chip,.tab-btn,.icon-btn,.btn,.fab,.sort-chip,
  .icon-opt,.theme-swatch,.sheet-btn,.favorite-toggle,.editor-toolbar-toggle,
  .tag-manage-btn,.add-card{
    transition:transform .12s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .book-card:active,.img-card:active,.article-card:active,.chip:active,.tab-btn:active,
  .icon-btn:active,.btn:active,.fab:active,.sort-chip:active,.icon-opt:active,
  .theme-swatch:active,.sheet-btn:active,.favorite-toggle:active,.add-card:active{
    transform:scale(.96);
  }

  .app-shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;box-shadow:0 0 60px rgba(0,0,0,.08);}
  .page-content{padding:4px 18px calc(104px + env(safe-area-inset-bottom));}

  /* Topbar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;padding:16px 14px 12px;gap:8px;
    position:sticky;top:0;z-index:12;background:var(--bg);
    box-shadow:0 1px 0 var(--line);
  }
  .home-topbar{padding:22px 18px 14px;position:static;box-shadow:none;background:transparent;}
  .app-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:28px;color:var(--ink);letter-spacing:.3px;position:relative;display:inline-block;}
  .app-title::after{content:'';display:block;width:30px;height:3px;background:var(--accent);border-radius:2px;margin-top:7px;}
  .app-subtitle{font-size:12.5px;color:var(--ink-soft);margin-top:9px;}
  .topbar-actions{display:flex;gap:8px;}
  .icon-btn{width:40px;height:40px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:0 0 auto;}
  .topbar-mini{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:600;color:var(--ink-soft);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .folder-title{display:flex;align-items:center;gap:7px;flex:1;justify-content:center;padding:7px 10px;border-radius:var(--radius-pill);}
  .folder-title-icon{font-size:18px;}
  .folder-title-text{font-family:'Noto Serif TC',serif;font-weight:600;font-size:17px;}
  .folder-title-edit{font-size:11px;opacity:.5;}

  /* Home */
  .folder-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;margin-top:10px;}
  .drag-hint{font-size:11.5px;color:var(--ink-faint);text-align:center;margin:2px 0 12px;}
  .book-card{
    border-radius:8px 10px 10px 8px;padding:12px 10px;aspect-ratio:3/4.4;
    display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:var(--shadow), inset -3px 0 7px -3px rgba(10,7,4,.3), inset 2px 0 0 rgba(255,255,255,.15);
    position:relative;overflow:hidden;
    border:1px solid rgba(255,255,255,.4);
    background-size:cover;background-position:center;
  }
  .book-card.dragging{opacity:.5;}
  .book-card-scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(10,7,4,.88), rgba(10,7,4,.25) 60%, rgba(10,7,4,.05));}
  .book-card-icon{
    width:32px;height:32px;border-radius:10px;position:absolute;top:10px;left:10px;z-index:1;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    background:rgba(255,255,255,.5);box-shadow:0 1px 3px rgba(36,26,16,.1);
  }
  .book-card.has-cover .book-card-icon{background:rgba(255,255,255,.28);backdrop-filter:blur(3px);}
  .book-card-text{position:relative;z-index:1;margin-top:26px;}
  .book-card-name{font-family:'Noto Serif TC',serif;font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .book-card.has-cover .book-card-name{color:#fff;}
  .book-card-desc{font-size:10px;margin-top:3px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .book-card.has-cover .book-card-desc{color:rgba(255,255,255,.82);}
  .book-card-count{font-size:10px;color:var(--ink-soft);margin-top:4px;}
  .book-card.has-cover .book-card-count{color:rgba(255,255,255,.7);}
  .add-card{background:transparent !important;border:1.5px dashed var(--line);align-items:center;justify-content:center;text-align:center;box-shadow:none;}
  .add-card-icon{font-size:20px;color:var(--ink-faint);width:auto;height:auto;background:none;box-shadow:none;position:static;}
  .add-card-label{font-size:11px;color:var(--ink-soft);margin-top:6px;text-align:center;padding:0 4px;}
  .cover-preview{position:relative;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);height:120px;}
  .cover-preview img{width:100%;height:100%;object-fit:cover;display:block;}

  /* Empty state */
  .empty-state{text-align:center;padding:56px 24px 20px;}
  .empty-icon{
    width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;
  }
  .empty-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:600;color:var(--ink);}
  .empty-desc{font-size:13px;color:var(--ink-soft);margin-top:7px;line-height:1.7;max-width:280px;margin-left:auto;margin-right:auto;}
  .empty-cta{text-align:center;margin-top:16px;}

  /* Tabs — segmented control */
  .tab-switch{display:flex;gap:4px;padding:6px 18px 2px;margin-top:2px;}
  .tab-switch::before{content:none;}
  .tab-btn{
    flex:1;border:none;background:var(--bg-deep);color:var(--ink-soft);
    padding:10px 4px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;
  }
  .tab-btn.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow);}
  .tab-count{font-size:11px;opacity:.75;margin-left:2px;}

  /* Sort row */
  .sort-row{display:flex;align-items:center;gap:8px;padding:14px 18px 0;}
  .tag-tools-label{font-size:12.5px;color:var(--ink-soft);flex:1;}
  .sort-chip-group{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;}
  .sort-chip-group::-webkit-scrollbar{display:none;}
  .sort-chip{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:7px 13px;border-radius:var(--radius-pill);font-size:12.5px;white-space:nowrap;flex:0 0 auto;}
  .sort-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .tag-manage-btn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);border-radius:var(--radius-pill);padding:7px 12px;font-size:12px;}

  /* Filter bar */
  .filter-bar{padding:10px 18px 4px;}
  .chip-scroll{display:flex;gap:7px;overflow-x:auto;padding:6px 2px 6px;scrollbar-width:none;}
  .chip-scroll::-webkit-scrollbar{display:none;}
  .chip{display:inline-flex;align-items:center;gap:3px;background:var(--card);color:var(--ink-soft);border:1px solid var(--line);padding:7px 13px;border-radius:var(--radius-pill);font-size:12.5px;white-space:nowrap;flex:0 0 auto;}
  .filter-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chip-removable{background:var(--accent-soft);color:var(--accent);border:none;padding:6px 7px 6px 13px;gap:6px;}
  .chip-removable button{border:none;background:none;color:var(--accent);font-size:15px;line-height:1;padding:0 2px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .tag{font-size:12px;color:var(--moss);background:var(--moss-soft);padding:4px 10px;border-radius:var(--radius-pill);}

  /* Waterfall */
  .waterfall{column-count:2;column-gap:11px;margin-top:10px;}
  .img-card{break-inside:avoid;margin-bottom:11px;border-radius:var(--radius-card);overflow:hidden;position:relative;box-shadow:var(--shadow);background:var(--card);}
  .img-card img{width:100%;display:block;}
  .img-card-overlay{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(to top,rgba(15,10,5,.78),rgba(15,10,5,0));}
  .img-card-title{color:#fff;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .img-count{position:absolute;top:9px;right:9px;background:rgba(15,10,5,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:var(--radius-pill);backdrop-filter:blur(2px);}
  .video-badge-mini{position:absolute;top:9px;left:9px;background:rgba(15,10,5,.55);color:#fff;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
  .fav-badge-mini{position:absolute;bottom:9px;left:9px;background:rgba(15,10,5,.55);color:var(--gold);font-size:13px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}

  /* Article overview grid */
  .article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
  .article-card{background:var(--card);border-radius:var(--radius-sm);padding:13px 11px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:120px;}
  .article-card-title{font-family:'Noto Serif TC',serif;font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.42;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
  .article-card-excerpt{font-size:10.5px;color:var(--ink-soft);margin-top:6px;line-height:1.55;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1;}
  .article-card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
  .article-card-meta .tag{font-size:9px;padding:2px 7px;}

  /* Badges */
  .badge{font-size:11.5px;padding:3px 9px;border-radius:var(--radius-pill);display:inline-block;}
  .badge.fav-badge{background:var(--gold-soft);color:var(--gold);}
  .fav-star{color:var(--gold);margin-right:4px;}

  /* Bottom nav — floating pill */
  .bottom-nav{
    position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:452px;margin:0 auto;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);display:flex;
    padding:8px 8px;box-shadow:var(--shadow-lg);z-index:30;
  }
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-faint);padding:7px 2px;border-radius:14px;}
  .nav-item.active{color:var(--accent);background:var(--accent-soft);}
  .nav-icon{font-size:19px;font-weight:700;line-height:1;}
  .nav-label{font-size:10px;font-weight:600;}

  /* FAB */
  .fab{
    position:fixed;right:20px;bottom:calc(94px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:50%;
    background:var(--accent);
    background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 78%, black));
    color:#fff;border:none;
    font-size:26px;box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.25);
    z-index:20;display:flex;align-items:center;justify-content:center;
  }

  /* Reading / gallery */
  .reading-page,.gallery-page{padding:10px var(--reading-pad-x, 22px) 84px;}
  .reading-title{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700;line-height:1.45;margin:8px 0 10px;}
  .reading-meta{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .reading-date{font-size:12px;color:var(--ink-faint);}
  .reading-content{font-family:var(--reading-font-family, 'Noto Serif TC',serif);font-size:var(--reading-font-size, 17px);line-height:var(--reading-line-height, 2);color:var(--ink);white-space:pre-wrap;margin-top:18px;padding-bottom:20px;letter-spacing:.1px;}
  .reading-embed-img{display:block;width:100%;border-radius:var(--radius-card);margin:18px 0;box-shadow:var(--shadow);}
  .gallery-stack{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .gallery-img-wrap{border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow);position:relative;}
  .gallery-img{width:100%;display:block;}
  .video-badge{position:absolute;bottom:10px;left:10px;background:rgba(15,10,5,.65);color:#fff;font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);backdrop-filter:blur(2px);}
  .gallery-img.fit-original{width:auto;max-width:100%;margin:0 auto;}

  /* Editor page (articles) */
  .editor-page{padding:10px 20px 112px;}
  .editor-title-input{width:100%;border:none;border-bottom:2px solid var(--line);background:transparent;font-family:'Noto Serif TC',serif;font-size:23px;font-weight:700;padding:10px 2px 12px;outline:none;color:var(--ink);}
  .editor-title-input:focus{border-color:var(--accent);}
  .editor-textarea{width:100%;min-height:36vh;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:16px;font-family:'Noto Serif TC',serif;font-size:16px;line-height:1.9;color:var(--ink);outline:none;resize:vertical;margin-top:16px;box-shadow:var(--shadow);}
  .editor-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .editor-wordcount{font-size:11.5px;color:var(--ink-faint);margin-top:6px;text-align:right;}
  .editor-toolbar-toggle{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-pill);padding:9px 15px;font-size:12.5px;color:var(--ink-soft);flex:1;text-align:center;}
  .editor-toolbar-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .embed-strip{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 2px;margin-top:10px;scrollbar-width:none;}
  .embed-strip::-webkit-scrollbar{display:none;}
  .embed-thumb{width:64px;height:64px;border-radius:var(--radius-xs);overflow:hidden;position:relative;background:var(--bg-deep);flex:0 0 auto;box-shadow:var(--shadow);}
  .embed-thumb img{width:100%;height:100%;object-fit:cover;}
  .embed-thumb-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(15,10,5,.6);color:#fff;font-size:11px;line-height:1;}
  .text-tools-panel{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;display:none;box-shadow:var(--shadow);}
  .text-tools-panel.open{display:block;}
  .text-tools-row{margin-bottom:9px;}
  .text-tools-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .text-tools-actions .btn{padding:8px 13px;font-size:12.5px;width:auto;}
  .editor-bottom-bar{
    position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
    background:var(--card);border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:15;
    box-shadow:0 -6px 20px rgba(36,26,16,.08);
  }

  /* Modal / sheet */
  .backdrop{position:fixed;inset:0;background:rgba(18,12,6,.5);z-index:1000;animation:fadeIn .18s ease-out;backdrop-filter:blur(1.5px);}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:14px 22px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    animation:sheetUp .24s cubic-bezier(.2,.8,.2,1);z-index:1001;
  }
  .sheet-grabber{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .sheet-close{position:absolute;top:16px;right:18px;width:30px;height:30px;border-radius:50%;border:none;background:var(--bg-deep);color:var(--ink-soft);font-size:16px;}
  .sheet-title{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:700;margin-bottom:16px;padding-right:30px;}
  .modal-loading{padding:34px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  .field-label{display:block;font-size:12.5px;color:var(--ink-soft);margin:16px 0 7px;font-weight:600;}
  .text-input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-xs);padding:11px 13px;font-size:14.5px;color:var(--ink);outline:none;}
  .text-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tag-row{display:flex;gap:8px;}
  .tag-row .tag-input{flex:1;}
  .btn{border:none;border-radius:var(--radius-pill);padding:12px 18px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;width:100%;box-shadow:0 6px 16px -4px rgba(122,50,68,.4);}
  .btn-ghost-sm{background:var(--bg-deep);color:var(--ink);padding:10px 15px;}
  .btn-danger-outline{background:none;border:1px solid var(--danger);color:var(--danger);width:100%;margin-bottom:10px;}
  .sheet-actions{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .sheet-actions.row{flex-direction:row;}
  .sheet-actions.row .btn{flex:1;}
  .icon-grid{display:flex;flex-wrap:wrap;gap:9px;}
  .icon-opt{width:44px;height:44px;border-radius:var(--radius-xs);border:1.5px solid var(--line);background:var(--bg);font-size:19px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .icon-opt.active{border-color:var(--accent);background:var(--accent-soft);}
  .icon-img{width:1em;height:1em;object-fit:cover;border-radius:5px;vertical-align:-0.15em;display:inline-block;}
  .icon-opt img{width:100%;height:100%;object-fit:cover;border-radius:0;}
  .icon-opt-upload{font-size:17px;color:var(--ink-soft);}
  .upload-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px;}
  .upload-mode-row{display:flex;gap:8px;margin-top:8px;}
  .upload-thumb{width:78px;height:78px;border-radius:var(--radius-sm);overflow:hidden;position:relative;background:var(--bg-deep);box-shadow:var(--shadow);}
  .video-badge-sm{position:absolute;bottom:3px;left:3px;background:rgba(15,10,5,.65);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px;}
  .upload-thumb img{width:100%;height:100%;object-fit:cover;}
  .upload-loading{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);text-align:center;padding:4px;}
  .upload-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(15,10,5,.6);color:#fff;font-size:12px;line-height:1;}
  .upload-btn{display:block;text-align:center;border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:14px;font-size:13.5px;color:var(--ink-soft);}

<script>
/* ============================================================
   資料架構說明（為未來雲端同步預留空間）
   - 所有讀寫都透過 storageGetRaw / storageSetRaw / storageDeleteRaw
     這幾個函式進行，未來若要換成雲端 API，只需要替換這幾個函式的
     實作，其餘畫面與邏輯不需更動。
   - folders：資料夾清單（輕量）
   - meta_<folderId>：該資料夾內所有收藏的完整索引。文章的標題／
     內文／標籤／狀態都直接存在這裡（一次寫入，避免內文與索引
     分開儲存時，其中一次寫入失敗造成內文遺失）。
   - item_<folderId>_<id>：僅圖片收藏使用，存放完整尺寸的圖片。
   ============================================================ */

let FOLDERS = [];
const META_CACHE = {};
let CURRENT_FILTER = { tags:[], favoriteOnly:false };
let FOLDER_VIEW_CTX = null;
let LAST_VIEWED_FOLDER_ID = null;
let DRAG_FOLDER_ID = null;
let UPLOAD_QUEUE = [];
let UPLOAD_MODE = 'group';
let EXISTING_IMAGE_FINGERPRINTS = new Set();
let TAG_DRAFT = [];
let EXISTING_TAGS_DRAFT = [];
let FAVORITE_DRAFT = false;
let EMBEDDED_IMAGES_DRAFT = {};
let FOLDER_ICON_DRAFT = null;

let COVER_DRAFT = null;
let EDITING = null;
let PROCESSING = false;
let LIGHTBOX_IMAGES = [];
let LIGHTBOX_IDX = 0;
let APP_NAME = '藏書閣';

window.addEventListener('beforeinstallprompt', (e)=>{

let HOME_SORT_MODE = 'recent';

const DEFAULT_ICONS = ['📚','📖','🖼️','🎨','🌙','⭐','🌸','🍀','🕯️','💌','🎬','🍬','🌊','🗂️','🔥','🧵'];
const THEME_BASE = {
  light: { '--bg':'#F1EADC','--bg-deep':'#E4D6BC','--card':'#FBF7ED','--ink':'#241A10','--ink-soft':'#6B5D46','--ink-faint':'#A0937A','--line':'#E1D3B4','--moss':'#4C5A40','--moss-soft':'#E4E9D6','--gold':'#8C6A1E','--gold-soft':'#F5E7BE','--danger':'#9B4237','--shadow':'0 1px 2px rgba(36,26,16,.06), 0 8px 22px -9px rgba(36,26,16,.28)','--shadow-lg':'0 20px 44px -16px rgba(36,26,16,.4), 0 4px 12px rgba(36,26,16,.14)' },
  dark:  { '--bg':'#161210','--bg-deep':'#1E1814','--card':'#241D18','--ink':'#F3EADA','--ink-soft':'#C8B99C','--ink-faint':'#8C7C63','--line':'#3A2F26','--moss':'#9CC08A','--moss-soft':'#26301F','--gold':'#E0B860','--gold-soft':'#3A2E16','--danger':'#E28E80','--shadow':'0 1px 2px rgba(0,0,0,.35), 0 8px 22px -9px rgba(0,0,0,.55)','--shadow-lg':'0 20px 44px -16px rgba(0,0,0,.65), 0 4px 12px rgba(0,0,0,.35)' }
};
const PALETTES = [
  { id:'burgundy', name:'胭脂', light:{'--accent':'#7A3244','--accent-soft':'#EADCD3'}, dark:{'--accent':'#E39BAD','--accent-soft':'#4A2530'} },
  { id:'teal',     name:'松石', light:{'--accent':'#2F6F66','--accent-soft':'#DCEAE6'}, dark:{'--accent':'#7FD9C9','--accent-soft':'#1F4740'} },
  { id:'indigo',   name:'靛藍', light:{'--accent':'#3B4C8C','--accent-soft':'#E1E4F2'}, dark:{'--accent':'#9DAEF0','--accent-soft':'#2A3563'} },
  { id:'caramel',  name:'焦糖', light:{'--accent':'#A9631E','--accent-soft':'#F3E2CC'}, dark:{'--accent':'#E3A75E','--accent-soft':'#4A3218'} },
  { id:'navy',     name:'藏青', light:{'--accent':'#24435F','--accent-soft':'#DDE6ED'}, dark:{'--accent':'#8FB6D9','--accent-soft':'#1B3145'} },
  { id:'mauve',    name:'梅紫', light:{'--accent':'#6B3E66','--accent-soft':'#EBDDE9'}, dark:{'--accent':'#CB9BC4','--accent-soft':'#3D2739'} }
];
let THEME_STATE = { mode:'light', palette:0 };

/* ---------- Utilities ---------- */
function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function favoriteBadgeHTML(fav){ return fav ? `<span class="badge fav-badge">★ 收藏</span>` : ''; }
function tagsHTML(tags){ return (tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join(''); }
function excerptOf(m){
  let text = (m.content!==undefined? m.content : (m.excerpt||'')) || '';
  text = text.replace(/\[\[img:[a-zA-Z0-9_]+\]\]/g, '📷');
  return text.replace(/\s+/g,' ').trim().slice(0,60);
}
function isImageIcon(icon){ return typeof icon==='string' && icon.indexOf('data:image')===0; }
function folderIconHTML(icon, cls){
  cls = cls || '';
  if(isImageIcon(icon)) return `<img src="${icon}" class="icon-img ${cls}"/>`;
  return `<span class="icon-emoji ${cls}">${icon||''}</span>`;
}
function emptyStateHTML(title, desc){
  return `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">${esc(title)}</div><div class="empty-desc">${esc(desc)}</div></div>`;
}
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2000);
}

/* ---------- Storage layer ----------
   Prefers window.storage (Claude's artifact-preview bridge). If that is
   missing or fails — e.g. this file was saved/opened directly, or added
   to a phone's home screen — it automatically falls back to the browser's
   own IndexedDB, so data still actually saves. */
const IDB_NAME = 'collection_app_db';
const IDB_STORE = 'kv';
let IDB = null;
let USE_BRIDGE = false;
function openIDB(){
  return new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbGet(key){
  return new Promise((resolve, reject)=>{
    const tx = IDB.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result===undefined ? null : req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbSet(key, value){
  return new Promise((resolve, reject)=>{
    const tx = IDB.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
function idbDelete(key){
  return new Promise((resolve, reject)=>{
    const tx = IDB.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function initStorage(){
  try{ IDB = await openIDB(); }catch(e){ IDB = null; }
  try{
    if(window.storage && typeof window.storage.set==='function'){
      const r = await window.storage.set('__probe__','1', false);
      if(r){ USE_BRIDGE = true; }
    }
  }catch(e){ /* fall through */ }
}

/* ---------- Optional cloud sync (Firebase Firestore) ----------
   Off by default. When the person connects a Firebase project + sync
   key (Theme page → 雲端同步), Firestore becomes the storage backend
   instead of the bridge/IndexedDB, so the same data shows up on any
   device using the same project + sync key. Firestore's own offline
   cache keeps things working without a connection, syncing again once
   back online. */
let FIREBASE_CONFIG = null;
let SYNC_KEY = null;
let FIRESTORE_DB = null;
let FIREBASE_SDK_LOADED = false;
function loadScriptTag(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
async function ensureFirebaseSDK(){
  if(FIREBASE_SDK_LOADED) return true;
  try{
    await loadScriptTag('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
    await loadScriptTag('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js');
    FIREBASE_SDK_LOADED = true;
    return true;
  }catch(e){ toast('雲端功能載入失敗，請檢查網路連線'); return false; }
}
async function initFirestore(){
  const ok = await ensureFirebaseSDK();
  if(!ok) return false;
  try{
    if(!window.firebase || !FIREBASE_CONFIG || !SYNC_KEY) return false;
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
    FIRESTORE_DB = firebase.firestore();
    try{ await FIRESTORE_DB.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* non-fatal: multiple tabs or unsupported browser */ }
    return true;
  }catch(e){ FIRESTORE_DB = null; toast('雲端連接失敗，請檢查設定內容'); return false; }
}
async function loadCloudCredentials(){
  try{
    const cfgRaw = await idbGet('__firebase_config__');
    const key = await idbGet('__sync_key__');
    if(cfgRaw && key){
      FIREBASE_CONFIG = JSON.parse(cfgRaw);
      SYNC_KEY = key;
      await initFirestore();
    }
  }catch(e){ /* ignore — falls back to local storage */ }
}
function firestoreDocRef(key){
  return FIRESTORE_DB.collection('sync').doc(SYNC_KEY).collection('kv').doc(key);
}

async function storageGetRaw(key){
  try{
    if(FIRESTORE_DB){
      const snap = await firestoreDocRef(key).get();
      return snap.exists ? (snap.data().value || null) : null;
    }
    if(USE_BRIDGE){
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }
    if(IDB){
      const v = await idbGet(key);
      return (v===null || v===undefined) ? null : v;
    }
    return null;
  }catch(e){ return null; }
}
async function storageSetRaw(key, value){
  try{
    if(FIRESTORE_DB){
      await firestoreDocRef(key).set({ value, updatedAt: Date.now() });
      return true;
    }
    if(USE_BRIDGE){
      const r = await window.storage.set(key, value, false);
      if(!r){ toast('儲存失敗，請再試一次'); return false; }
      return true;
    }
    if(IDB){ await idbSet(key, value); return true; }
    toast('這個瀏覽器不支援本機儲存，資料無法保存');
    return false;
  }catch(e){ toast(FIRESTORE_DB ? '雲端儲存失敗，請確認網路連線' : '儲存失敗，請再試一次'); return false; }
}
async function storageDeleteRaw(key){
  try{
    if(FIRESTORE_DB){ await firestoreDocRef(key).delete(); return; }
    if(USE_BRIDGE){ await window.storage.delete(key, false); return; }
    if(IDB){ await idbDelete(key); }
  }catch(e){ /* ignore missing key */ }
}

async function loadFolders(){
  const raw = await storageGetRaw('folders');
  try{ FOLDERS = raw ? JSON.parse(raw) : []; }catch(e){ FOLDERS = []; }
}
async function persistFolders(){
  return await storageSetRaw('folders', JSON.stringify(FOLDERS));
}
function cloneMetaArr(arr){ return JSON.parse(JSON.stringify(arr)); }
async function getMeta(folderId){
  if(META_CACHE[folderId]) return cloneMetaArr(META_CACHE[folderId]);
  const idxRaw = await storageGetRaw('meta_'+folderId);
  let idxParsed = [];
  try{ idxParsed = idxRaw ? JSON.parse(idxRaw) : []; }catch(e){ idxParsed = []; }
  if(idxParsed.length && typeof idxParsed[0]==='object'){
    /* legacy format from before: the whole array was stored as one blob.
       Keep working immediately, and migrate to per-item docs in the background. */
    META_CACHE[folderId] = idxParsed;
    migrateMetaToPerItem(folderId, idxParsed);
    return cloneMetaArr(idxParsed);
  }
  const ids = idxParsed;
  const items = await Promise.all(ids.map(async id=>{
    const raw = await storageGetRaw('metaitem_'+folderId+'_'+id);
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }));
  const arr = items.filter(Boolean);
  META_CACHE[folderId] = arr;
  return cloneMetaArr(arr);
}
async function migrateMetaToPerItem(folderId, arr){
  try{
    await Promise.all(arr.map(item=> storageSetRaw('metaitem_'+folderId+'_'+item.id, JSON.stringify(item))));
    await storageSetRaw('meta_'+folderId, JSON.stringify(arr.map(x=>x.id)));
  }catch(e){ /* best-effort; will just retry next time this folder loads */ }
}
async function setMeta(folderId, arr){
  const previous = META_CACHE[folderId] || [];
  const prevMap = {};
  previous.forEach(p=>{ prevMap[p.id] = p; });
  const newIds = arr.map(x=>x.id);
  const changedItems = arr.filter(item=>{
    const prevItem = prevMap[item.id];
    return !prevItem || JSON.stringify(prevItem) !== JSON.stringify(item);
  });
  const removedIds = previous.filter(p=>!newIds.includes(p.id)).map(p=>p.id);
  try{
    const writeResults = await Promise.all(changedItems.map(item=> storageSetRaw('metaitem_'+folderId+'_'+item.id, JSON.stringify(item))));
    if(writeResults.some(r=>r===false)) return false;
    await Promise.all(removedIds.map(id=> storageDeleteRaw('metaitem_'+folderId+'_'+id)));
    const idxOk = await storageSetRaw('meta_'+folderId, JSON.stringify(newIds));
    if(!idxOk) return false;
    META_CACHE[folderId] = cloneMetaArr(arr);
    return true;
  }catch(e){ return false; }
}
async function getItem(folderId, id){
  const raw = await storageGetRaw('item_'+folderId+'_'+id);
  try{ return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function setItem(folderId, id, obj){
  return await storageSetRaw('item_'+folderId+'_'+id, JSON.stringify(obj));
}
async function deleteItemFull(folderId, id){
  await storageDeleteRaw('item_'+folderId+'_'+id);
}

/* ---------- Theme & app identity ---------- */
function applyTheme(mode, paletteIdx){
  mode = (mode==='dark') ? 'dark' : 'light';
  if(paletteIdx==null || paletteIdx<0 || paletteIdx>=PALETTES.length) paletteIdx = 0;
  const root = document.documentElement;
  const base = THEME_BASE[mode];
  Object.keys(base).forEach(k=> root.style.setProperty(k, base[k]));
  const pal = PALETTES[paletteIdx];
  const palTokens = pal[mode] || pal.light;
  Object.keys(palTokens).forEach(k=> root.style.setProperty(k, palTokens[k]));
  THEME_STATE = { mode, palette: paletteIdx };
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', base['--bg']);
}
function currentAccentColor(){
  return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7A3244';
}
function setLinkRel(rel, href){
  let link = document.querySelector('link[rel="'+rel+'"]');
  if(!link){ link=document.createElement('link'); link.rel=rel; document.head.appendChild(link); }
  link.href = href;
}
function generateAppIcon(icon, bgColor){
  return new Promise((resolve)=>{
    const canvas = document.createElement('canvas');
    canvas.width = 192; canvas.height = 192;
    const ctx = canvas.getContext('2d');
    const r = 36;
    const drawRoundedBg = ()=>{
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(192-r,0); ctx.quadraticCurveTo(192,0,192,r);
      ctx.lineTo(192,192-r); ctx.quadraticCurveTo(192,192,192-r,192);
      ctx.lineTo(r,192); ctx.quadraticCurveTo(0,192,0,192-r);
      ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0); ctx.closePath();
    };
    drawRoundedBg(); ctx.fill();
    if(isImageIcon(icon)){
      const img = new Image();
      img.onload = ()=>{
        ctx.save();
        drawRoundedBg(); ctx.clip();
        ctx.drawImage(img, 0, 0, 192, 192);
        ctx.restore();
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=> resolve(canvas.toDataURL('image/png'));
      img.src = icon;
    } else {
      ctx.font = '104px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(icon || '📚', 96, 104);
      resolve(canvas.toDataURL('image/png'));
    }
  });
}
async function applyAppIdentity(name, emoji){
  document.title = name + ' · 私人收藏';
  const bg = currentAccentColor();
  const iconUrl = await generateAppIcon(emoji, bg);
  setLinkRel('apple-touch-icon', iconUrl);
  setLinkRel('icon', iconUrl);
  let metaTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if(!metaTitle){ metaTitle=document.createElement('meta'); metaTitle.setAttribute('name','apple-mobile-web-app-title'); document.head.appendChild(metaTitle); }
  metaTitle.setAttribute('content', name);
  try{
    const manifest = {
      name: name, short_name: name.slice(0,12), start_url:'.', display:'standalone',
      background_color: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#EDE3D0',
      theme_color: bg,
      icons:[{ src:iconUrl, sizes:'192x192', type:'image/png' },{ src:iconUrl, sizes:'512x512', type:'image/png' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    setLinkRel('manifest', url);
  }catch(e){ /* manifest generation is best-effort */ }
  return iconUrl;
}
async function loadSettings(){
  const raw = await storageGetRaw('settings');
  const defaults = { mode:'light', palette:0, appName:'藏書閣', appIcon:'📚', homeSortMode:'recent', defaultLanding:'home',
    reading:{ fontSize:'medium', lineHeight:'normal', font:'serif', width:'normal', imageFit:'fit' } };
  let s = defaults;

      if(parsed){ s = Object.assign({}, defaults, parsed); s.reading = Object.assign({}, defaults.reading, parsed.reading||{}); }
    }
  }catch(e){ /* use defaults */ }
  applyTheme(s.mode, s.palette);

async function saveSettings(){

function applyReadingPrefs(prefs){
  const root = document.documentElement;
  const sizeMap = { small:'15px', medium:'17px', large:'19.5px' };
  const lhMap = { compact:'1.7', normal:'2', relaxed:'2.3' };
  const fontMap = { serif:"'Noto Serif TC',serif", sans:"'Noto Sans TC',sans-serif" };
  const padMap = { narrow:'32px', normal:'22px', wide:'14px' };
  root.style.setProperty('--reading-font-size', sizeMap[prefs.fontSize] || sizeMap.medium);

}

/* ---------- Filtering & sorting ---------- */
function filterMeta(list, filter){
  return list.filter(m=>{
    if(filter.favoriteOnly && !m.favorite) return false;
    if(filter.tags && filter.tags.length && !filter.tags.every(t=>(m.tags||[]).includes(t))) return false;
    return true;
  });
}
function sortMeta(list, sortKey){
  const arr = list.slice();
  if(sortKey==='oldest') arr.sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));
  else if(sortKey==='title') arr.sort((a,b)=> (a.title||'').localeCompare(b.title||'','zh-Hant'));
  else arr.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
  return arr;
}

const EMBED_TOKEN_RE = /\[\[img:([a-zA-Z0-9]+)\]\]/g;
function renderArticleBody(content, embeddedImages){
  embeddedImages = embeddedImages || {};
  const re = new RegExp(EMBED_TOKEN_RE.source, 'g');
  let lastIndex = 0, out = '', match;
  while((match = re.exec(content)) !== null){
    const before = content.slice(lastIndex, match.index);
    if(before.trim()) out += `<span class="reading-text-block">${esc(before)}</span>`;
    const src = embeddedImages[match[1]];
    if(src) out += `<img class="reading-embed-img" src="${src}" loading="lazy"/>`;
    lastIndex = re.lastIndex;
  }
  const rest = content.slice(lastIndex);
  if(rest) out += `<span class="reading-text-block">${esc(rest)}</span>`;
  return out;
}

/* ---------- Lightbox ---------- */
function openLightbox(idx){ LIGHTBOX_IDX = idx; renderLightbox(); }
function renderLightbox(){
  const root = document.getElementById('overlay-root');
  const multi = LIGHTBOX_IMAGES.length > 1;
  const current = LIGHTBOX_IMAGES[LIGHTBOX_IDX];
  const isVideo = current && current.kind==='video';
  const src = current ? current.src : '';
  root.innerHTML = `<div class="lightbox" data-act="lightbox-close">
    <button class="lb-close" data-act="lightbox-close" aria-label="關閉">×</button>
    ${isVideo ? `<video class="lb-img" src="${src}" controls autoplay playsinline></video>` : `<img class="lb-img" src="${src}"/>`}
    ${multi? `<button class="lb-nav lb-prev" data-act="lightbox-prev" aria-label="上一張">‹</button><button class="lb-nav lb-next" data-act="lightbox-next" aria-label="下一張">›</button><div class="lb-count">${LIGHTBOX_IDX+1} / ${LIGHTBOX_IMAGES.length}</div>` : ''}
  </div>`;
  const img = root.querySelector('.lb-img');
  img.addEventListener('click', e=>e.stopPropagation());
  const lb = root.querySelector('.lightbox');
  let sx = 0;
  lb.addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx) > 40) lightboxNav(dx>0 ? -1 : 1);
  }, {passive:true});
}
function lightboxNav(dir){
  LIGHTBOX_IDX = (LIGHTBOX_IDX + dir + LIGHTBOX_IMAGES.length) % LIGHTBOX_IMAGES.length;
  renderLightbox();
}
function closeLightbox(){ document.getElementById('overlay-root').innerHTML=''; }

async function doRandomDraw(folderId){

async function saveTagManager(folderId){
  const rows = document.querySelectorAll('#tag-manager-list .tag-manager-row');
  const renameMap = {};
  rows.forEach(row=>{
    const oldTag = row.dataset.tag;
    const input = row.querySelector('input');
    renameMap[oldTag] = input ? input.value.trim() : '';
  });
  const meta = await getMeta(folderId);
  meta.forEach(m=>{
    if(!m.tags || !m.tags.length) return;
    const newTags = [];
    m.tags.forEach(t=>{
      const mapped = Object.prototype.hasOwnProperty.call(renameMap, t) ? renameMap[t] : t;
      if(mapped && !newTags.includes(mapped)) newTags.push(mapped);
    });
    m.tags = newTags;
  });
  const ok = await setMeta(folderId, meta);
  if(!ok) return;
  closeModal();
  await rerenderCurrentFilterView();
  toast('標籤已更新');
}

function parseFirebaseConfigInput(raw){
  if(!raw) return null;
  const start = raw.indexOf('{');
  const end = raw.lastIndexOf('}');
  if(start===-1 || end===-1 || end<start) return null;
  let body = raw.slice(start, end+1);
  body = body.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g, '$1"$2":');
  body = body.replace(/'([^'\\]*)'/g, '"$1"');
  body = body.replace(/,(\s*[}\]])/g, '$1');
  try{ return JSON.parse(body); }catch(e){ return null; }
}
async function connectCloudSync(){
  const cfgInput = document.getElementById('firebase-config-input');
  const keyInput = document.getElementById('sync-key-input');
  const raw = cfgInput ? cfgInput.value.trim() : '';
  const key = keyInput ? keyInput.value.trim() : '';
  if(!raw || !key){ toast('請貼上 Firebase 設定並填寫同步代碼'); return; }
  const cfg = parseFirebaseConfigInput(raw);
  if(!cfg || !cfg.apiKey || !cfg.projectId){ toast('看不懂這段設定，請確認有貼到完整的 { ... } 內容，包含 apiKey 與 projectId'); return; }
  toast('連接中…');
  FIREBASE_CONFIG = cfg; SYNC_KEY = key;
  const ok = await initFirestore();
  if(!ok){ FIREBASE_CONFIG = null; SYNC_KEY = null; return; }
  await idbSet('__firebase_config__', JSON.stringify(cfg));
  await idbSet('__sync_key__', key);
  toast('雲端同步已連接，重新整理中…');
  setTimeout(()=> location.reload(), 600);
}
async function disconnectCloudSync(){
  if(!confirm('確定要中斷雲端同步嗎？這台裝置會改用本機儲存，本機資料不會被清空，但之後不會再跟雲端同步。')) return;
  await idbDelete('__firebase_config__');
  await idbDelete('__sync_key__');
  location.reload();
}

let MAMMOTH_LOADED = false;
async function ensureMammothSDK(){
  if(MAMMOTH_LOADED) return true;
  try{
    await loadScriptTag('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
    MAMMOTH_LOADED = !!window.mammoth;
    if(!MAMMOTH_LOADED) toast('文件解析功能載入失敗');
    return MAMMOTH_LOADED;
  }catch(e){ toast('文件解析功能載入失敗，請檢查網路連線'); return false; }
}
async function readFileAsArticleText(file){
  const name = (file.name||'').toLowerCase();
  if(name.endsWith('.docx')){
    const ok = await ensureMammothSDK();
    if(!ok) return null;
    const buf = await file.arrayBuffer();
    const result = await window.mammoth.extractRawText({ arrayBuffer: buf });
    return (result && typeof result.value==='string') ? result.value : '';
  }
  return await file.text();
}
function extractTitleAndBody(text, fallbackName){
  const trimmed = (text||'').replace(/\r\n/g,'\n');
  const lines = trimmed.split('\n');
  let i = 0;
  while(i<lines.length && lines[i].trim()==='') i++;
  let firstLine = (i<lines.length) ? lines[i].trim() : '';
  firstLine = firstLine.replace(/^#+\s*/, '');
  if(firstLine && firstLine.length<=60){
    const rest = lines.slice(i+1).join('\n').replace(/^\n+/, '');
    return { title: firstLine, content: rest };
  }
  return { title: fallbackName || '未命名文章', content: trimmed.trim() };
}
async function handleBulkImportFiles(files, folderId){
  if(!files || !files.length) return;
  toast('匯入中，請稍候…');
  const meta = await getMeta(folderId);
  const newArr = meta.slice();
  const now = Date.now();
  let successCount = 0, failCount = 0;
  let offset = 0;
  for(const file of Array.from(files)){
    try{
      const text = await readFileAsArticleText(file);
      if(text===null){ failCount++; continue; }
      const nameNoExt = (file.name||'未命名文章').replace(/\.[^.]+$/, '');
      const parsed = extractTitleAndBody(text, nameNoExt);
      const id = uid();
      newArr.push({
        id, folderId, type:'article',
        title: parsed.title || nameNoExt || '未命名文章',
        content: parsed.content || '',
        tags: [], favorite: false, embeddedImages: {},
        createdAt: now + offset, updatedAt: now + offset
      });
      offset++;
      successCount++;
    }catch(e){ failCount++; }
  }
  if(successCount>0){
    const ok = await setMeta(folderId, newArr);
    if(!ok){ toast('匯入失敗，請再試一次'); return; }
  }
  if(failCount>0 && successCount>0) toast('已匯入 '+successCount+' 篇，'+failCount+' 個檔案無法解析');
  else if(failCount>0) toast('匯入失敗，'+failCount+' 個檔案無法解析');
  else toast('已匯入 '+successCount+' 篇文章');
  if(successCount>0) location.hash = '#/folder/'+folderId+'/articles';
}

async function computeFileFingerprint(file){
  try{
    const buf = await file.arrayBuffer();
    const view = new Uint8Array(buf);
    let hash = 0x811c9dc5;
    for(let i=0;i<view.length;i++){
      hash ^= view[i];
      hash = Math.imul(hash, 0x01000193);
    }
    return (hash>>>0).toString(16)+'_'+file.size;
  }catch(e){ return file.name+'_'+file.size; }
}
function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
function normalizeMedia(item){
  if(!item) return [];
  if(Array.isArray(item.media)) return item.media;
  if(Array.isArray(item.images)) return item.images.map(src=>({ src, kind:'image' }));
  return [];
}
function generateVideoPlaceholderThumb(){
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(0,0,320,320);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.moveTo(128,108); ctx.lineTo(128,212); ctx.lineTo(212,160); ctx.closePath();
  ctx.fill();
  return canvas.toDataURL('image/jpeg', 0.7);
}
function captureVideoFrameFromSrc(src){
  return new Promise((resolve)=>{
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true; video.preload = 'auto';
    let settled = false;
    const fallback = ()=>{ if(settled) return; settled = true; resolve(generateVideoPlaceholderThumb()); };
    const timeout = setTimeout(fallback, 4000);
    video.addEventListener('loadedmetadata', ()=>{
      try{ video.currentTime = Math.min(0.5, (video.duration||1)/2); }
      catch(e){ fallback(); }
    });
    video.addEventListener('seeked', ()=>{
      if(settled) return;
      try{
        const maxDim = 320;
        let w = video.videoWidth, h = video.videoHeight;
        if(!w || !h){ fallback(); return; }
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, w, h);
        settled = true; clearTimeout(timeout);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      }catch(e){ fallback(); }
    });
    video.addEventListener('error', fallback);
    video.src = src;
    video.load();
  });
}
async function generateVideoFrameThumbFromFile(file){
  let url;
  try{ url = URL.createObjectURL(file); }
  catch(e){ return generateVideoPlaceholderThumb(); }
  const result = await captureVideoFrameFromSrc(url);
  try{ URL.revokeObjectURL(url); }catch(e){}
  return result;
}
function fileToSquareDataURL(file, size, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
function fileToResizedDataURL(file, maxDim, quality, targetBytes){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let width = img.width, height = img.height;
        if(width > height){ if(width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        let q = quality;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        if(targetBytes){
          let attempts = 0;
          while(dataUrl.length*0.75 > targetBytes && q > 0.4 && attempts < 5){
            q -= 0.08;
            dataUrl = canvas.toDataURL('image/jpeg', q);
            attempts++;
          }
        }
        resolve(dataUrl);
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
async function handleFileSelect(files){
  if(!files || !files.length) return;
  PROCESSING = true; renderUploadPreview();
  let duplicateCount = 0, skippedTooBig = 0;
  for(const file of Array.from(files)){
    try{
      const isVideo = file.type && file.type.indexOf('video/')===0;
      if(isVideo){
        const cap = FIRESTORE_DB ? 700*1024 : (USE_BRIDGE ? 4.5*1024*1024 : 30*1024*1024);
        if(file.size > cap){ skippedTooBig++; continue; }
        const fingerprint = await computeFileFingerprint(file);
        if(EXISTING_IMAGE_FINGERPRINTS.has(fingerprint)){ duplicateCount++; continue; }
        const dataUrl = await fileToDataURL(file);
        const thumb = await generateVideoFrameThumbFromFile(file);
        UPLOAD_QUEUE.push({ full:dataUrl, thumb, fingerprint, kind:'video' });
        EXISTING_IMAGE_FINGERPRINTS.add(fingerprint);
      } else {
        const fingerprint = await computeFileFingerprint(file);
        if(EXISTING_IMAGE_FINGERPRINTS.has(fingerprint)){ duplicateCount++; continue; }
        const results = await Promise.all([
          fileToResizedDataURL(file, 1000, 0.72, 650*1024),
          fileToResizedDataURL(file, 320, 0.6, 70*1024)
        ]);
        UPLOAD_QUEUE.push({ full:results[0], thumb:results[1], fingerprint, kind:'image' });
        EXISTING_IMAGE_FINGERPRINTS.add(fingerprint);
      }
    }catch(e){ toast('有一個檔案處理失敗'); }
  }
  PROCESSING = false;
  renderUploadPreview();
  if(skippedTooBig>0) toast('有 '+skippedTooBig+' 個影片超過目前儲存方式的大小上限，已略過');
  if(duplicateCount>0) toast('已略過 '+duplicateCount+' 個重複檔案，避免佔用兩份空間');
}
function removeUploadPreview(idx){
  const removed = UPLOAD_QUEUE.splice(idx,1)[0];
  if(removed && removed.fingerprint) EXISTING_IMAGE_FINGERPRINTS.delete(removed.fingerprint);
  renderUploadPreview();
}
async function saveImageItemFromModalSeparate(folderId){
  const meta = await getMeta(folderId);
  const newArr = meta.slice();
  const now = Date.now();
  const pending = UPLOAD_QUEUE.map((u,i)=>({
    id: uid(),
    full: u.full,
    thumb: u.thumb || u.full,
    kind: u.kind || 'image',
    fingerprint: u.fingerprint,
    offset: i
  }));
  pending.forEach(p=>{
    newArr.push({ id:p.id, folderId, type:'image', title:'', tags:[].concat(TAG_DRAFT), favorite:false, thumb:p.thumb, imageCount:1, hasVideo:p.kind==='video', fingerprints:[p.fingerprint].filter(Boolean), createdAt: now+p.offset, updatedAt: now+p.offset });
  });
  const metaOk = await setMeta(folderId, newArr);
  if(!metaOk) return;
  let failCount = 0;
  for(const p of pending){
    const ok = await setItem(folderId, p.id, { media:[{ src:p.full, kind:p.kind }] });
    if(!ok) failCount++;
  }
  closeModal();
  await route();
  toast(failCount>0 ? ('已新增，但 '+failCount+' 個檔案儲存失敗') : ('已新增 '+pending.length+' 個檔案'));
}
async function saveImageItemFromModal(folderId, existingId){
  if(UPLOAD_QUEUE.length===0){ toast('請至少上傳一張圖片或影片'); return; }
  if(!existingId && UPLOAD_MODE==='separate'){
    await saveImageItemFromModalSeparate(folderId);
    return;
  }
  const now = Date.now();
  const media = UPLOAD_QUEUE.map(u=>({ src:u.full, kind:u.kind||'image' }));
  const fingerprints = UPLOAD_QUEUE.map(u=>u.fingerprint).filter(Boolean);
  const thumb = UPLOAD_QUEUE[0].thumb || UPLOAD_QUEUE[0].full;
  if(existingId){
    const meta = await getMeta(folderId);
    const m = meta.find(x=>x.id===existingId);
    if(m){ m.tags=[].concat(TAG_DRAFT); m.thumb=thumb; m.imageCount=media.length; m.hasVideo=media.some(x=>x.kind==='video'); m.fingerprints=fingerprints; m.updatedAt=now; }
    const metaOk = await setMeta(folderId, meta);
    if(!metaOk) return;
    const itemOk = await setItem(folderId, existingId, { media });
    if(!itemOk) return;
  } else {
    const meta = await getMeta(folderId);
    const newArr = meta.slice();
    const id = uid();
    newArr.push({ id, folderId, type:'image', tags:[].concat(TAG_DRAFT), thumb, imageCount:media.length, hasVideo:media.some(x=>x.kind==='video'), fingerprints, createdAt:now, updatedAt:now });
    const metaOk = await setMeta(folderId, newArr);
    if(!metaOk) return;
    const itemOk = await setItem(folderId, id, { media });
    if(!itemOk) return;
  }
  closeModal();
  await route();
  toast('已儲存');
}

/* ---------- Global click / change delegation ---------- */
async function onAppClick(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  try{
    switch(act){
      case 'go-home': location.hash = '#/'; break;
      case 'go-new-folder': location.hash = '#/folder-editor/new'; break;
      case 'go-theme': location.hash = '#/theme'; break;
      case 'open-folder': location.hash = '#/folder/'+el.dataset.id+'/'+(el.dataset.tab||'articles'); break;
      case 'edit-folder': location.hash = '#/folder-editor/'+el.dataset.id; break;
      case 'switch-tab': location.hash = '#/folder/'+el.dataset.folder+'/'+el.dataset.tab; break;
      case 'open-item': location.hash = '#/item/'+el.dataset.folder+'/'+el.dataset.id; break;
      case 'fab-add':
        if(el.dataset.tab==='images') openImageModal(el.dataset.folder);
        else location.hash = '#/edit-article/'+el.dataset.folder+'/new';
        break;
      case 'go-settings': location.hash = '#/settings'; break;
      case 'go-back': if(history.length>1) history.back(); else location.hash='#/'; break;
      case 'random-draw': case 'redraw': await doRandomDraw(el.dataset.folder); break;
      case 'random-draw-global': case 'redraw-global': await doRandomDrawGlobal(); break;
      case 'go-to-random-item': closeModal(); location.hash = '#/item/'+el.dataset.folder+'/'+el.dataset.id; break;
      case 'item-menu': await openItemActionSheet(el.dataset.folder, el.dataset.id); break;
      case 'close-modal': closeModal(); break;
      case 'save-folder-page': await saveFolderPage(); break;
      case 'delete-folder-page': await deleteFolderFromPage(el.dataset.id); break;
      case 'pick-icon': pickIcon(el.dataset.icon); break;
      case 'pick-custom-icon': pickCustomIcon(); break;
      case 'remove-cover': removeCoverDraft(); break;
      case 'save-article': await saveArticle(el.dataset.folder, el.dataset.id||null); break;
      case 'save-image-item': await saveImageItemFromModal(el.dataset.folder, el.dataset.id||null); break;
      case 'add-tag': addTagFromInput(); break;
      case 'add-existing-tag': addExistingTag(el.dataset.tag); break;
      case 'remove-tag': TAG_DRAFT = TAG_DRAFT.filter(t=>t!==el.dataset.tag); renderTagChips(); break;
      case 'toggle-favorite': {
        FAVORITE_DRAFT = !FAVORITE_DRAFT;
        const btn = document.getElementById('favorite-toggle-btn');
        if(btn){ btn.classList.toggle('active', FAVORITE_DRAFT); btn.textContent = FAVORITE_DRAFT ? '★ 已收藏' : '☆ 加入收藏'; }
        break;
      }
      case 'toggle-item-favorite': await toggleItemFavorite(el.dataset.folder, el.dataset.id); break;
      case 'edit-item': await openEditForItem(el.dataset.folder, el.dataset.id); break;
      case 'delete-item': await deleteItemConfirm(el.dataset.folder, el.dataset.id); break;
      case 'open-lightbox': openLightbox(Number(el.dataset.idx)); break;
      case 'lightbox-close': closeLightbox(); break;
      case 'lightbox-prev': lightboxNav(-1); break;
      case 'lightbox-next': lightboxNav(1); break;
      case 'remove-upload-preview': removeUploadPreview(Number(el.dataset.idx)); break;
      case 'set-upload-mode': {
        UPLOAD_MODE = el.dataset.mode;
        document.querySelectorAll('[data-upload-mode-btn]').forEach(btn=> btn.classList.toggle('active', btn.dataset.mode===UPLOAD_MODE));
        break;
      }
      case 'export-backup': await exportBackup(); break;
      case 'connect-cloud': await connectCloudSync(); break;
      case 'disconnect-cloud': await disconnectCloudSync(); break;
      case 'filter-favorite': toggleFavoriteFilter(); await rerenderCurrentFilterView(); break;
      case 'filter-tag': toggleTagFilter(el.dataset.tag); await rerenderCurrentFilterView(); break;
      case 'manage-tags': await openTagManager(el.dataset.folder); break;
      case 'tag-manager-clear': { const row = el.closest('.tag-manager-row'); if(row){ const inp = row.querySelector('input'); if(inp) inp.value=''; } break; }
      case 'save-tag-manager': await saveTagManager(el.dataset.folder); break;
      case 'toggle-text-tools': { const p = document.getElementById('text-tools-panel'); if(p) p.classList.toggle('open'); break; }
      case 'remove-embed-image': removeEmbedImage(el.dataset.id); break;
      case 'find-next': findNextInEditor(); break;
      case 'replace-one': replaceOneInEditor(); break;
      case 'replace-all': replaceAllInEditor(); break;
      case 'set-theme-mode': applyTheme(el.dataset.mode, THEME_STATE.palette); await applyAppIdentity(APP_NAME, APP_ICON); await saveSettings(); await renderThemePage(); break;
      case 'set-theme-palette': applyTheme(THEME_STATE.mode, Number(el.dataset.idx)); await applyAppIdentity(APP_NAME, APP_ICON); await saveSettings(); await renderThemePage(); break;
      case 'set-app-icon': APP_ICON = el.dataset.icon; await applyAppIdentity(APP_NAME, APP_ICON); await saveSettings(); await renderThemePage(); break;
      case 'save-app-name': {
        const inp = document.getElementById('app-name-input');
        APP_NAME = (inp ? inp.value.trim() : '') || '藏書閣';
        await applyAppIdentity(APP_NAME, APP_ICON);
        await saveSettings();
        await renderThemePage();
        toast('已更新');
        break;
      }
      case 'set-home-sort': HOME_SORT_MODE = el.dataset.value; await saveSettings(); await renderSettings(); break;
      case 'install-app': {
        if(DEFERRED_INSTALL_PROMPT){
          DEFERRED_INSTALL_PROMPT.prompt();
          try{ await DEFERRED_INSTALL_PROMPT.userChoice; }catch(err){}
          DEFERRED_INSTALL_PROMPT = null;
          await renderThemePage();
        }
        break;
      }
      case 'set-default-landing': DEFAULT_LANDING = el.dataset.value; await saveSettings(); await renderSettings(); toast('已更新'); break;
      case 'set-reading-pref': {
        READING_PREFS = Object.assign({}, READING_PREFS, { [el.dataset.key]: el.dataset.value });
        applyReadingPrefs(READING_PREFS);
        await saveSettings();
        await renderSettings();
        break;
      }
      case 'move-folder-order': {
        const idx = FOLDERS.findIndex(x=>x.id===el.dataset.id);
        const dir = Number(el.dataset.dir);
        const swapIdx = idx + dir;
        if(idx>=0 && swapIdx>=0 && swapIdx<FOLDERS.length){
          const tmp = FOLDERS[idx]; FOLDERS[idx] = FOLDERS[swapIdx]; FOLDERS[swapIdx] = tmp;
          await persistFolders();
          await renderSettings();
        }
        break;
      }
    }
  }catch(err){ console.error(err); toast('發生錯誤，請再試一次'); }
}
function onFolderDragStart(e){
  const card = e.target.closest('[data-folder-drag]');
  if(!card || card.getAttribute('draggable')!=='true') return;
  DRAG_FOLDER_ID = card.dataset.folderDrag;
  card.classList.add('dragging');
  if(e.dataTransfer){
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', DRAG_FOLDER_ID); }catch(err){}
  }
}
function onFolderDragOver(e){
  if(!DRAG_FOLDER_ID) return;
  const card = e.target.closest('[data-folder-drag]');
  if(!card) return;
  e.preventDefault();
}
async function onFolderDrop(e){
  if(!DRAG_FOLDER_ID) return;
  const card = e.target.closest('[data-folder-drag]');
  if(!card) return;
  e.preventDefault();
  const targetId = card.dataset.folderDrag;
  if(targetId && targetId !== DRAG_FOLDER_ID){
    const fromIdx = FOLDERS.findIndex(f=>f.id===DRAG_FOLDER_ID);
    const toIdx = FOLDERS.findIndex(f=>f.id===targetId);
    if(fromIdx>=0 && toIdx>=0){
      const moved = FOLDERS.splice(fromIdx,1)[0];
      FOLDERS.splice(toIdx,0,moved);
      await persistFolders();
      await renderHome();
    }
  }
}
function onFolderDragEnd(e){
  const card = e.target.closest('[data-folder-drag]');
  if(card) card.classList.remove('dragging');
  DRAG_FOLDER_ID = null;
}
async function onAppChange(e){
  if(e.target && e.target.id==='file-input'){
    await handleFileSelect(e.target.files);
    e.target.value = '';
  }
  if(e.target && e.target.id==='embed-image-file-input'){
    const files = e.target.files;
    e.target.value = '';
    await handleEmbedImageSelect(files);
  }
  if(e.target && e.target.id==='bulk-import-file-input'){
    const folderId = e.target.dataset.folder;
    const files = e.target.files;
    e.target.value = '';
    await handleBulkImportFiles(files, folderId);
  }
  if(e.target && e.target.id==='folder-cover-file-input'){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const dataUrl = await fileToResizedDataURL(file, 800, 0.72, 400*1024);
      COVER_DRAFT = dataUrl;
      rerenderFolderEditor();
    }catch(err){ toast('圖片處理失敗，請再試一次'); }
  }
  if(e.target && e.target.id==='folder-icon-file-input'){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const dataUrl = await fileToSquareDataURL(file, 160, 0.85);
      CUSTOM_ICON_PREVIEW = dataUrl;
      FOLDER_ICON_DRAFT = dataUrl;
      rerenderFolderEditor();
    }catch(err){ toast('圖片處理失敗，請再試一次'); }
  }
  if(e.target && e.target.id==='app-icon-file-input'){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const dataUrl = await fileToSquareDataURL(file, 192, 0.9);
      APP_ICON = dataUrl;
      await applyAppIdentity(APP_NAME, APP_ICON);
      await saveSettings();
      await renderSettings();
      toast('已更新圖示');
    }catch(err){ toast('圖片處理失敗，請再試一次'); }
  }
}

/* ---------- Init ---------- */
async function init(){
  document.body.addEventListener('click', onAppClick);
  document.body.addEventListener('change', onAppChange);
  document.body.addEventListener('dragstart', onFolderDragStart);
  document.body.addEventListener('dragover', onFolderDragOver);
  document.body.addEventListener('drop', onFolderDrop);
  document.body.addEventListener('dragend', onFolderDragEnd);
  await initStorage();
  await loadCloudCredentials();
  await loadSettings();
  await loadFolders();
  if(parseHash().length===0 && DEFAULT_LANDING && DEFAULT_LANDING!=='home'){
    const f = FOLDERS.find(x=>x.id===DEFAULT_LANDING);
    if(f){ location.hash = '#/folder/'+f.id+'/articles'; return; }
  }
  await route();
}
init();
</script>
